[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "group-vault"
version = "0.1.0"
description = "Decentralized group vault using threshold secret sharing"
requires-python = ">=3.11"
dependencies = [
    "pycryptodome>=3.24",
    "argon2-cffi>=23",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["ruff>=0.16", "mypy>=2.4"]

[project.scripts]
vault-coordinator = "group_vault.coordinator:main"
vault-cli = "group_vault.vault_cli:main"

[tool.setuptools]
packages = ["group_vault"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
